spring:
  application:
    name: launchforge-config-edge
  datasource:
    url: ${LAUNCHFORGE_DB_URL}
    username: ${LAUNCHFORGE_DB_USER}
    password: ${LAUNCHFORGE_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 20
  flyway:
    enabled: false
  data:
    redis:
      host: ${LAUNCHFORGE_REDIS_HOST:localhost}
      port: ${LAUNCHFORGE_REDIS_PORT:56379}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:59092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
  codec:
    max-in-memory-size: 1MB

server:
  port: ${LAUNCHFORGE_CONFIG_EDGE_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 8KB

launchforge:
  sdk-keys:
    peppers:
      v1: ${LAUNCHFORGE_SDK_KEY_PEPPER}
  config-edge:
    redis-enabled: ${LAUNCHFORGE_EDGE_REDIS_ENABLED:true}
    maximum-snapshot-bytes: 1048576
    revision-poll-interval: ${LAUNCHFORGE_EDGE_REVISION_POLL_INTERVAL:1s}
    heartbeat-interval: ${LAUNCHFORGE_EDGE_HEARTBEAT_INTERVAL:15s}
    maximum-connections: ${LAUNCHFORGE_EDGE_MAX_CONNECTIONS:1000}
    maximum-connections-per-key: ${LAUNCHFORGE_EDGE_MAX_CONNECTIONS_PER_KEY:5}
    maximum-concurrent-database-fallbacks: ${LAUNCHFORGE_EDGE_MAX_DB_FALLBACKS:8}
    database-fallback-acquire-timeout: ${LAUNCHFORGE_EDGE_DB_FALLBACK_ACQUIRE_TIMEOUT:100ms}
    invalidation-channel: ${LAUNCHFORGE_REDIS_INVALIDATION_CHANNEL:launchforge:config:revision-hints:v1}
  analytics:
    ingestion:
      enabled: ${LAUNCHFORGE_ANALYTICS_ENABLED:false}
      topic: ${LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC:launchforge.analytics.evaluations.v1}
      maximum-request-bytes: 262144
      maximum-batch-size: 100
      maximum-concurrent-requests: ${LAUNCHFORGE_ANALYTICS_MAX_CONCURRENT_INGESTS:16}
      requests-per-key-per-minute: ${LAUNCHFORGE_ANALYTICS_REQUESTS_PER_KEY_PER_MINUTE:600}
      publish-timeout: 2s

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,metrics
