spring:
  application:
    name: launchforge-config-edge
  datasource:
    url: ${LAUNCHFORGE_DB_URL}
    username: ${LAUNCHFORGE_DB_USER}
    password: ${LAUNCHFORGE_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 20
  flyway:
    enabled: false
  data:
    redis:
      host: ${LAUNCHFORGE_REDIS_HOST:localhost}
      port: ${LAUNCHFORGE_REDIS_PORT:56379}
      connect-timeout: 2s
      timeout: 2s
  kafka:
    bootstrap-servers: ${LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:59092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
  codec:
    max-in-memory-size: 256KB

server:
  port: ${LAUNCHFORGE_CONFIG_EDGE_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 8KB

launchforge:
  sdk-keys:
    peppers:
      v1: ${LAUNCHFORGE_SDK_KEY_PEPPER}
  config-edge:
    redis-enabled: ${LAUNCHFORGE_EDGE_REDIS_ENABLED:true}
    maximum-snapshot-bytes: 1048576
    revision-poll-interval: ${LAUNCHFORGE_EDGE_REVISION_POLL_INTERVAL:1s}
    heartbeat-interval: ${LAUNCHFORGE_EDGE_HEARTBEAT_INTERVAL:15s}
    maximum-connections: ${LAUNCHFORGE_EDGE_MAX_CONNECTIONS:1000}
    maximum-connections-per-key: ${LAUNCHFORGE_EDGE_MAX_CONNECTIONS_PER_KEY:5}
    maximum-concurrent-database-fallbacks: ${LAUNCHFORGE_EDGE_MAX_DB_FALLBACKS:8}
    database-fallback-acquire-timeout: ${LAUNCHFORGE_EDGE_DB_FALLBACK_ACQUIRE_TIMEOUT:100ms}
    invalidation-channel: ${LAUNCHFORGE_REDIS_INVALIDATION_CHANNEL:launchforge:config:revision-hints:v1}
  analytics:
    ingestion:
      enabled: ${LAUNCHFORGE_ANALYTICS_ENABLED:false}
      topic: ${LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC:launchforge.analytics.evaluations.v1}
      maximum-request-bytes: 262144
      maximum-batch-size: 100
      maximum-concurrent-requests: ${LAUNCHFORGE_ANALYTICS_MAX_CONCURRENT_INGESTS:16}
      requests-per-key-per-minute: ${LAUNCHFORGE_ANALYTICS_REQUESTS_PER_KEY_PER_MINUTE:600}
      publish-timeout: 2s
  security:
    abuse:
      redis-enabled: ${LAUNCHFORGE_SECURITY_RATE_LIMIT_REDIS_ENABLED:true}
      window: 1m
      snapshot-requests-per-window: ${LAUNCHFORGE_SNAPSHOT_REQUESTS_PER_MINUTE:600}
      stream-starts-per-window: ${LAUNCHFORGE_STREAM_STARTS_PER_MINUTE:30}
      analytics-requests-per-window: ${LAUNCHFORGE_ANALYTICS_REQUESTS_PER_KEY_PER_MINUTE:600}
      stream-lease-duration: 2m

management:
  otlp:
    metrics:
      export:
        enabled: ${LAUNCHFORGE_OTLP_METRICS_ENABLED:false}
  opentelemetry:
    enabled: ${LAUNCHFORGE_OTEL_ENABLED:false}
    resource-attributes:
      deployment.environment.name: ${LAUNCHFORGE_DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${LAUNCHFORGE_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 3s
      limits:
        max-attributes: 64
        max-attribute-value-length: 256
  tracing:
    export:
      otlp:
        enabled: ${LAUNCHFORGE_OTEL_ENABLED:false}
    propagation:
      type: w3c
    sampling:
      probability: ${LAUNCHFORGE_TRACE_SAMPLING_PROBABILITY:0.1}
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  structured:
    format:
      console: ${LAUNCHFORGE_LOG_FORMAT:ecs}
