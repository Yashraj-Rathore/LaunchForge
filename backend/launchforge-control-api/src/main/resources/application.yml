spring:
  application:
    name: launchforge-control-api
  datasource:
    url: ${LAUNCHFORGE_DB_URL}
    username: ${LAUNCHFORGE_DB_USER}
    password: ${LAUNCHFORGE_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 10
  sql:
    init:
      mode: never
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: launchforge_session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${LAUNCHFORGE_OIDC_CLIENT_ID}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: ${LAUNCHFORGE_OIDC_ISSUER_URI}

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-launchforge_session
        http-only: true
        secure: true
        same-site: lax
        path: /

launchforge:
  demo-seed:
    enabled: false
  sdk-keys:
    current-pepper-version: ${LAUNCHFORGE_SDK_KEY_PEPPER_VERSION:v1}
    peppers:
      v1: ${LAUNCHFORGE_SDK_KEY_PEPPER}
  security:
    session:
      absolute-lifetime: ${LAUNCHFORGE_SESSION_ABSOLUTE_LIFETIME:12h}
  analytics:
    query:
      enabled: ${LAUNCHFORGE_ANALYTICS_ENABLED:false}
      click-house-url: ${LAUNCHFORGE_CLICKHOUSE_URL:http://localhost:58123}
      click-house-user: ${LAUNCHFORGE_CLICKHOUSE_USER:launchforge}
      click-house-password: ${LAUNCHFORGE_CLICKHOUSE_PASSWORD:}
      maximum-concurrent-queries: ${LAUNCHFORGE_ANALYTICS_MAX_CONCURRENT_QUERIES:8}
      maximum-range: 31d
      maximum-rows: 1000

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
