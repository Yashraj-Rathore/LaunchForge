spring:
  application:
    name: launchforge-event-worker
  datasource:
    url: ${LAUNCHFORGE_DB_URL:jdbc:postgresql://localhost:5432/launchforge?connectTimeout=5&socketTimeout=15&tcpKeepAlive=true}
    username: ${LAUNCHFORGE_DB_USER:launchforge}
    password: ${LAUNCHFORGE_DB_PASSWORD:launchforge-local}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      maximum-pool-size: 8
  kafka:
    bootstrap-servers: ${LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS:localhost:59092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      group-id: ${LAUNCHFORGE_KAFKA_CONSUMER_GROUP:launchforge-config-projector-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record
  data:
    redis:
      host: ${LAUNCHFORGE_REDIS_HOST:localhost}
      port: ${LAUNCHFORGE_REDIS_PORT:56379}
      connect-timeout: 2s
      timeout: 2s

launchforge:
  distribution:
    topic: ${LAUNCHFORGE_KAFKA_CONFIG_TOPIC:launchforge.config.revision-published.v1}
    consumer-group: ${LAUNCHFORGE_KAFKA_CONSUMER_GROUP:launchforge-config-projector-v1}
    invalidation-channel: ${LAUNCHFORGE_REDIS_INVALIDATION_CHANNEL:launchforge:config:revision-hints:v1}
  analytics:
    worker:
      enabled: ${LAUNCHFORGE_ANALYTICS_ENABLED:false}
      topic: ${LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC:launchforge.analytics.evaluations.v1}
      consumer-group: ${LAUNCHFORGE_KAFKA_ANALYTICS_CONSUMER_GROUP:launchforge-analytics-writer-v1}
      queue-capacity: ${LAUNCHFORGE_ANALYTICS_QUEUE_CAPACITY:10000}
      insert-batch-size: ${LAUNCHFORGE_ANALYTICS_INSERT_BATCH_SIZE:500}
      flush-interval: ${LAUNCHFORGE_ANALYTICS_FLUSH_INTERVAL:1s}
      click-house-url: ${LAUNCHFORGE_CLICKHOUSE_URL:http://localhost:58123}
      click-house-user: ${LAUNCHFORGE_CLICKHOUSE_USER:launchforge}
      click-house-password: ${LAUNCHFORGE_CLICKHOUSE_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
