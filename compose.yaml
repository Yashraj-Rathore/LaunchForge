name: launchforge

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    environment:
      POSTGRES_DB: ${LAUNCHFORGE_POSTGRES_DB:-launchforge}
      POSTGRES_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      POSTGRES_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env and set LAUNCHFORGE_POSTGRES_PASSWORD}
    ports:
      - '${LAUNCHFORGE_BIND_ADDRESS:-127.0.0.1}:${LAUNCHFORGE_POSTGRES_PORT:-55432}:5432'
    volumes:
      - launchforge-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LAUNCHFORGE_KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAUNCHFORGE_KEYCLOAK_ADMIN_PASSWORD:?Set a local-only Keycloak admin password in .env}
      LAUNCHFORGE_DEMO_USER_PASSWORD: ${LAUNCHFORGE_DEMO_USER_PASSWORD:?Set a local-only demo user password in .env}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: ${LAUNCHFORGE_CONTAINER_OIDC_ORIGIN:-http://localhost:8081}
    ports:
      - '${LAUNCHFORGE_BIND_ADDRESS:-127.0.0.1}:8081:8080'
    volumes:
      - ./deploy/local/keycloak/launchforge-realm.json:/opt/keycloak/data/import/launchforge-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s

  kafka:
    profiles: [distribution]
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${LAUNCHFORGE_KAFKA_ADVERTISED_HOST:-localhost}:${LAUNCHFORGE_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    ports:
      - '${LAUNCHFORGE_BIND_ADDRESS:-127.0.0.1}:${LAUNCHFORGE_KAFKA_PORT:-59092}:9094'
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  redis:
    profiles: [distribution]
    image: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
    command: [redis-server, --save, '', --appendonly, 'no']
    ports:
      - '${LAUNCHFORGE_BIND_ADDRESS:-127.0.0.1}:${LAUNCHFORGE_REDIS_PORT:-56379}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

  clickhouse:
    profiles: [analytics]
    image: clickhouse:26.7.1.1315@sha256:16537a9270ad63acbbee437ebbb826ea62b49690e863ae33e2fc5c16b7d9466c
    environment:
      CLICKHOUSE_DB: launchforge
      CLICKHOUSE_USER: ${LAUNCHFORGE_CLICKHOUSE_USER:-launchforge}
      CLICKHOUSE_PASSWORD: ${LAUNCHFORGE_CLICKHOUSE_PASSWORD:?Set a local-only ClickHouse password in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:${LAUNCHFORGE_CLICKHOUSE_PORT:-58123}:8123'
    volumes:
      - launchforge-clickhouse:/var/lib/clickhouse
      - ./deploy/local/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}"
          --query 'SELECT 1'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.158.0@sha256:c5918f78992ee73b0d6f0e599423ac5ec52dd5d9726733114d6eca53d5a32ed5
    command: [--config=/etc/otelcol-contrib/config.yaml]
    ports:
      - '127.0.0.1:${LAUNCHFORGE_OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${LAUNCHFORGE_OTLP_HTTP_PORT:-4318}:4318'
    volumes:
      - ./deploy/local/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    stop_grace_period: 10s

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${LAUNCHFORGE_PROMETHEUS_PORT:-59090}:9090'
    volumes:
      - ./deploy/local/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/local/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - launchforge-prometheus:/prometheus
    healthcheck:
      test: [CMD, wget, --spider, -q, http://localhost:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    environment:
      GF_SECURITY_ADMIN_USER: ${LAUNCHFORGE_GRAFANA_ADMIN_USER:-launchforge}
      GF_SECURITY_ADMIN_PASSWORD: ${LAUNCHFORGE_GRAFANA_ADMIN_PASSWORD:?Set a local-only Grafana admin password in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    ports:
      - '127.0.0.1:${LAUNCHFORGE_GRAFANA_PORT:-53000}:3000'
    volumes:
      - ./deploy/local/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - launchforge-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, wget --spider -q http://localhost:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    stop_grace_period: 15s

  migrations:
    profiles: [platform]
    image: launchforge-migrator:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrator
      args:
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
    environment:
      LAUNCHFORGE_DB_URL: jdbc:postgresql://postgres:5432/${LAUNCHFORGE_POSTGRES_DB:-launchforge}?connectTimeout=5&socketTimeout=15&tcpKeepAlive=true
      LAUNCHFORGE_DB_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      LAUNCHFORGE_DB_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

  demo-seed:
    profiles: [demo]
    image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    environment:
      PGHOST: postgres
      PGDATABASE: ${LAUNCHFORGE_POSTGRES_DB:-launchforge}
      PGUSER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      PGPASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
    command:
      - psql
      - --set
      - ON_ERROR_STOP=1
      - --set
      - demo_oidc_issuer=${LAUNCHFORGE_CONTAINER_OIDC_ISSUER_URI:-http://host.docker.internal:8081/realms/launchforge}
      - --file
      - /seed/tenancy-seed.sql
      - --file
      - /seed/compose-demo-issuer.sql
    volumes:
      - ./deploy/local/tenancy-seed.sql:/seed/tenancy-seed.sql:ro
      - ./deploy/local/compose-demo-issuer.sql:/seed/compose-demo-issuer.sql:ro
    depends_on:
      migrations:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'

  launchforge-management:
    profiles: [platform]
    image: launchforge-management:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.java
      args:
        MODULE: backend/launchforge-control-api
        ARTIFACT: backend/launchforge-control-api/target/launchforge-control-api-0.1.0-SNAPSHOT-exec.jar
        APP_PORT: 8080
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_FLYWAY_ENABLED: 'false'
      LAUNCHFORGE_DB_URL: jdbc:postgresql://postgres:5432/${LAUNCHFORGE_POSTGRES_DB:-launchforge}?connectTimeout=5&socketTimeout=15&tcpKeepAlive=true
      LAUNCHFORGE_DB_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      LAUNCHFORGE_DB_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
      LAUNCHFORGE_REDIS_HOST: redis
      LAUNCHFORGE_REDIS_PORT: 6379
      LAUNCHFORGE_OIDC_ISSUER_URI: ${LAUNCHFORGE_CONTAINER_OIDC_ISSUER_URI:-http://host.docker.internal:8081/realms/launchforge}
      LAUNCHFORGE_OIDC_CLIENT_ID: ${LAUNCHFORGE_OIDC_CLIENT_ID:-launchforge-control}
      LAUNCHFORGE_SDK_KEY_PEPPER: ${LAUNCHFORGE_SDK_KEY_PEPPER:?Set a random local-only SDK key pepper in .env}
      LAUNCHFORGE_SDK_KEY_PEPPER_VERSION: ${LAUNCHFORGE_SDK_KEY_PEPPER_VERSION:-v1}
      LAUNCHFORGE_DEMO_SEED_ENABLED: 'false'
      LAUNCHFORGE_ANALYTICS_ENABLED: ${LAUNCHFORGE_ANALYTICS_ENABLED:-false}
      LAUNCHFORGE_CLICKHOUSE_URL: http://clickhouse:8123
      LAUNCHFORGE_CLICKHOUSE_USER: ${LAUNCHFORGE_CLICKHOUSE_USER:-launchforge}
      LAUNCHFORGE_CLICKHOUSE_PASSWORD: ${LAUNCHFORGE_CLICKHOUSE_PASSWORD:-}
      LAUNCHFORGE_OTEL_ENABLED: ${LAUNCHFORGE_OTEL_ENABLED:-false}
      LAUNCHFORGE_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s

  launchforge-config-edge:
    profiles: [platform]
    image: launchforge-config-edge:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.java
      args:
        MODULE: backend/launchforge-config-edge
        ARTIFACT: backend/launchforge-config-edge/target/launchforge-config-edge-0.1.0-SNAPSHOT-exec.jar
        APP_PORT: 8082
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
    environment:
      LAUNCHFORGE_DB_URL: jdbc:postgresql://postgres:5432/${LAUNCHFORGE_POSTGRES_DB:-launchforge}?connectTimeout=5&socketTimeout=15&tcpKeepAlive=true
      LAUNCHFORGE_DB_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      LAUNCHFORGE_DB_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
      LAUNCHFORGE_REDIS_HOST: redis
      LAUNCHFORGE_REDIS_PORT: 6379
      LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LAUNCHFORGE_SDK_KEY_PEPPER: ${LAUNCHFORGE_SDK_KEY_PEPPER:?Set a random local-only SDK key pepper in .env}
      LAUNCHFORGE_ANALYTICS_ENABLED: ${LAUNCHFORGE_ANALYTICS_ENABLED:-false}
      LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC: ${LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC:-launchforge.analytics.evaluations.v1}
      LAUNCHFORGE_OTEL_ENABLED: ${LAUNCHFORGE_OTEL_ENABLED:-false}
      LAUNCHFORGE_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - '127.0.0.1:${LAUNCHFORGE_CONFIG_EDGE_PORT:-8082}:8082'
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s

  launchforge-event-worker:
    profiles: [platform]
    image: launchforge-event-worker:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.java
      args:
        MODULE: backend/launchforge-event-worker
        ARTIFACT: backend/launchforge-event-worker/target/launchforge-event-worker-0.1.0-SNAPSHOT-exec.jar
        APP_PORT: 8083
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
    environment:
      LAUNCHFORGE_DB_URL: jdbc:postgresql://postgres:5432/${LAUNCHFORGE_POSTGRES_DB:-launchforge}?connectTimeout=5&socketTimeout=15&tcpKeepAlive=true
      LAUNCHFORGE_DB_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      LAUNCHFORGE_DB_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Set a local-only PostgreSQL password in .env}
      LAUNCHFORGE_REDIS_HOST: redis
      LAUNCHFORGE_REDIS_PORT: 6379
      LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LAUNCHFORGE_ANALYTICS_ENABLED: ${LAUNCHFORGE_ANALYTICS_ENABLED:-false}
      LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC: ${LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC:-launchforge.analytics.evaluations.v1}
      LAUNCHFORGE_KAFKA_ANALYTICS_CONSUMER_GROUP: ${LAUNCHFORGE_KAFKA_ANALYTICS_CONSUMER_GROUP:-launchforge-analytics-writer-v1}
      LAUNCHFORGE_CLICKHOUSE_URL: http://clickhouse:8123
      LAUNCHFORGE_CLICKHOUSE_USER: ${LAUNCHFORGE_CLICKHOUSE_USER:-launchforge}
      LAUNCHFORGE_CLICKHOUSE_PASSWORD: ${LAUNCHFORGE_CLICKHOUSE_PASSWORD:-}
      LAUNCHFORGE_OTEL_ENABLED: ${LAUNCHFORGE_OTEL_ENABLED:-false}
      LAUNCHFORGE_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - '127.0.0.1:${LAUNCHFORGE_EVENT_WORKER_PORT:-8083}:8083'
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
        required: false
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s

  launchforge-web:
    profiles: [platform]
    image: launchforge-web:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      args:
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
    ports:
      - '127.0.0.1:${LAUNCHFORGE_WEB_PORT:-8080}:8080'
    depends_on:
      launchforge-management:
        condition: service_healthy
      launchforge-config-edge:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m
      - /var/run/nginx:size=1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

  northstar-storefront:
    profiles: [demo]
    image: launchforge-northstar-demo:${LAUNCHFORGE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
      target: demo-runtime
      args:
        OCI_CREATED: ${LAUNCHFORGE_OCI_CREATED:-local}
        OCI_REVISION: ${LAUNCHFORGE_OCI_REVISION:-local}
        OCI_VERSION: ${LAUNCHFORGE_IMAGE_TAG:-local}
        DEMO_EDGE_URL: http://127.0.0.1:${LAUNCHFORGE_CONFIG_EDGE_PORT:-8082}
        DEMO_CLIENT_KEY_SUFFIX: NorthstarDemoClientKey0000000001
    ports:
      - '127.0.0.1:${LAUNCHFORGE_DEMO_STOREFRONT_PORT:-5174}:8080'
    depends_on:
      demo-seed:
        condition: service_completed_successfully
      launchforge-config-edge:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m
      - /var/run/nginx:size=1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s

volumes:
  launchforge-postgres:
  launchforge-clickhouse:
  launchforge-prometheus:
  launchforge-grafana:
