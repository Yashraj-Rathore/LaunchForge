name: launchforge

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:d9c83446333daec3f0588cc709adb80c26090b7f9f0f7ec8d43c243385d79818
    environment:
      POSTGRES_DB: ${LAUNCHFORGE_POSTGRES_DB:-launchforge}
      POSTGRES_USER: ${LAUNCHFORGE_POSTGRES_USER:-launchforge}
      POSTGRES_PASSWORD: ${LAUNCHFORGE_POSTGRES_PASSWORD:?Copy .env.example to .env and set LAUNCHFORGE_POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${LAUNCHFORGE_POSTGRES_PORT:-55432}:5432'
    volumes:
      - launchforge-postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  keycloak:
    profiles: [identity]
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${LAUNCHFORGE_KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LAUNCHFORGE_KEYCLOAK_ADMIN_PASSWORD:?Set a local-only Keycloak admin password in .env}
      LAUNCHFORGE_DEMO_USER_PASSWORD: ${LAUNCHFORGE_DEMO_USER_PASSWORD:?Set a local-only demo user password in .env}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:8081:8080'
    volumes:
      - ./deploy/local/keycloak/launchforge-realm.json:/opt/keycloak/data/import/launchforge-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    stop_grace_period: 30s

  kafka:
    profiles: [distribution]
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${LAUNCHFORGE_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
    ports:
      - '127.0.0.1:${LAUNCHFORGE_KAFKA_PORT:-59092}:9094'
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  redis:
    profiles: [distribution]
    image: redis:8.2.8-bookworm@sha256:2f7462b9e93e0a7ae2edf3a0a0babc8a4d29f8bfc50849b906b7caaef925edc1
    command: [redis-server, --save, '', --appendonly, 'no']
    ports:
      - '127.0.0.1:${LAUNCHFORGE_REDIS_PORT:-56379}:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s

volumes:
  launchforge-postgres:
