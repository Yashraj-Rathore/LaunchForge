services:
  kafka:
    environment:
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,CLIENT://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,CLIENT://kafka:9092,EXTERNAL://${LAUNCHFORGE_KAFKA_ADVERTISED_HOST:-localhost}:${LAUNCHFORGE_KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,CLIENT:SASL_SSL,EXTERNAL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_CLIENT_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${LAUNCHFORGE_KAFKA_BROKER_PASSWORD:?Set a local Kafka broker password}"
        user_${LAUNCHFORGE_KAFKA_SASL_USERNAME:-launchforge-platform}="${LAUNCHFORGE_KAFKA_SASL_PASSWORD:?Set a local Kafka SASL password}";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="broker" password="${LAUNCHFORGE_KAFKA_BROKER_PASSWORD:?Set a local Kafka broker password}"
        user_${LAUNCHFORGE_KAFKA_SASL_USERNAME:-launchforge-platform}="${LAUNCHFORGE_KAFKA_SASL_PASSWORD:?Set a local Kafka SASL password}";
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /run/launchforge/kafka/server.p12
      KAFKA_SSL_KEYSTORE_PASSWORD: ${LAUNCHFORGE_KAFKA_KEYSTORE_PASSWORD:?Set the local Kafka PKCS12 password}
      KAFKA_SSL_KEY_PASSWORD: ${LAUNCHFORGE_KAFKA_KEYSTORE_PASSWORD:?Set the local Kafka PKCS12 password}
      KAFKA_SSL_CLIENT_AUTH: none
    volumes:
      - type: bind
        source: ${LAUNCHFORGE_KAFKA_KEYSTORE_FILE:-./deploy/local/tls/kafka-server.p12}
        target: /run/launchforge/kafka/server.p12
        read_only: true
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list]

  redis:
    environment:
      LAUNCHFORGE_REDIS_TLS_ENABLED: 'true'
      LAUNCHFORGE_REDIS_TLS_CERTIFICATE: /run/launchforge/redis/server.crt
      LAUNCHFORGE_REDIS_TLS_PRIVATE_KEY: /run/launchforge/redis/server.key
      LAUNCHFORGE_REDIS_TLS_CA_CERTIFICATE: /run/launchforge/redis/ca.crt
    volumes:
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_CERTIFICATE_FILE:-./deploy/local/tls/redis-server.crt}
        target: /run/launchforge/redis/server.crt
        read_only: true
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_PRIVATE_KEY_FILE:-./deploy/local/tls/redis-server.key}
        target: /run/launchforge/redis/server.key
        read_only: true
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/redis-ca.crt}
        target: /run/launchforge/redis/ca.crt
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$${LAUNCHFORGE_REDIS_EVENT_WORKER_PASSWORD}"
          redis-cli --tls --cacert /run/launchforge/redis/ca.crt
          --user launchforge-event-worker ping

  launchforge-management:
    environment:
      LAUNCHFORGE_REDIS_SSL_ENABLED: 'true'
      SPRING_DATA_REDIS_SSL_BUNDLE: redis
      SPRING_SSL_BUNDLE_PEM_REDIS_TRUSTSTORE_CERTIFICATE: file:/run/launchforge/redis/ca.crt
    volumes:
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/redis-ca.crt}
        target: /run/launchforge/redis/ca.crt
        read_only: true

  launchforge-config-edge:
    environment:
      LAUNCHFORGE_REDIS_SSL_ENABLED: 'true'
      SPRING_DATA_REDIS_SSL_BUNDLE: redis
      SPRING_SSL_BUNDLE_PEM_REDIS_TRUSTSTORE_CERTIFICATE: file:/run/launchforge/redis/ca.crt
      LAUNCHFORGE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
      LAUNCHFORGE_KAFKA_SASL_ENABLED: 'true'
      LAUNCHFORGE_KAFKA_SASL_MECHANISM: PLAIN
      LAUNCHFORGE_KAFKA_SASL_LOGIN_MODULE: org.apache.kafka.common.security.plain.PlainLoginModule
      LAUNCHFORGE_KAFKA_SASL_USERNAME: ${LAUNCHFORGE_KAFKA_SASL_USERNAME:-launchforge-platform}
      LAUNCHFORGE_KAFKA_SASL_PASSWORD: ${LAUNCHFORGE_KAFKA_SASL_PASSWORD:?Set a local Kafka SASL password}
      SPRING_KAFKA_SSL_BUNDLE: kafka
      SPRING_SSL_BUNDLE_PEM_KAFKA_TRUSTSTORE_CERTIFICATE: file:/run/launchforge/kafka/ca.crt
    volumes:
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/redis-ca.crt}
        target: /run/launchforge/redis/ca.crt
        read_only: true
      - type: bind
        source: ${LAUNCHFORGE_KAFKA_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/kafka-ca.crt}
        target: /run/launchforge/kafka/ca.crt
        read_only: true

  launchforge-event-worker:
    environment:
      LAUNCHFORGE_REDIS_SSL_ENABLED: 'true'
      SPRING_DATA_REDIS_SSL_BUNDLE: redis
      SPRING_SSL_BUNDLE_PEM_REDIS_TRUSTSTORE_CERTIFICATE: file:/run/launchforge/redis/ca.crt
      LAUNCHFORGE_KAFKA_SECURITY_PROTOCOL: SASL_SSL
      LAUNCHFORGE_KAFKA_SASL_ENABLED: 'true'
      LAUNCHFORGE_KAFKA_SASL_MECHANISM: PLAIN
      LAUNCHFORGE_KAFKA_SASL_LOGIN_MODULE: org.apache.kafka.common.security.plain.PlainLoginModule
      LAUNCHFORGE_KAFKA_SASL_USERNAME: ${LAUNCHFORGE_KAFKA_SASL_USERNAME:-launchforge-platform}
      LAUNCHFORGE_KAFKA_SASL_PASSWORD: ${LAUNCHFORGE_KAFKA_SASL_PASSWORD:?Set a local Kafka SASL password}
      SPRING_KAFKA_SSL_BUNDLE: kafka
      SPRING_SSL_BUNDLE_PEM_KAFKA_TRUSTSTORE_CERTIFICATE: file:/run/launchforge/kafka/ca.crt
    volumes:
      - type: bind
        source: ${LAUNCHFORGE_REDIS_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/redis-ca.crt}
        target: /run/launchforge/redis/ca.crt
        read_only: true
      - type: bind
        source: ${LAUNCHFORGE_KAFKA_TLS_CA_CERTIFICATE_FILE:-./deploy/local/tls/kafka-ca.crt}
        target: /run/launchforge/kafka/ca.crt
        read_only: true
