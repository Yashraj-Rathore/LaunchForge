global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: launchforge-control-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]
  - job_name: launchforge-config-edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8082]
  - job_name: launchforge-event-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8083]
