apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchforge.fullname" . }}-config-edge
  labels:
    {{- include "launchforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-edge
spec:
  replicas: {{ .Values.configEdge.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "launchforge.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: config-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "launchforge.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: config-edge
      annotations:
        checksum/runtime-config: {{ toJson (dict "database" .Values.external.database "kafka" .Values.external.kafka "redis" .Values.external.redis) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "launchforge.fullname" . }}-config-edge
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.configEdge.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "launchforge.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: config-edge
          image: {{ include "launchforge.image" .Values.images.configEdge | quote }}
          imagePullPolicy: {{ .Values.images.configEdge.pullPolicy }}
          securityContext:
            {{- include "launchforge.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8082, protocol: TCP}
          env:
            {{- include "launchforge.databaseEnv" . | nindent 12 }}
            - {name: LAUNCHFORGE_REDIS_HOST, value: {{ .Values.external.redis.host | quote }}}
            - {name: LAUNCHFORGE_REDIS_PORT, value: {{ .Values.external.redis.port | quote }}}
            - {name: LAUNCHFORGE_REDIS_USERNAME, value: {{ .Values.external.redis.usernames.configEdge | quote }}}
            - name: LAUNCHFORGE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.redisConfigEdgePasswordKey | quote }}
            - name: LAUNCHFORGE_MATERIALIZATION_VERIFICATION_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.materializationVerificationKeysKey | quote }}
            - {name: LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS, value: {{ .Values.external.kafka.bootstrapServers | quote }}}
            - name: LAUNCHFORGE_SDK_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.sdkKeyPepperKey | quote }}
            - name: LAUNCHFORGE_ANALYTICS_ENABLED
              value: {{ .Values.external.analytics.enabled | quote }}
            - name: LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC
              value: {{ .Values.external.analytics.kafkaTopic | quote }}
            {{- include "launchforge.commonJavaEnv" . | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, 'sleep 10']
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.configEdge.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: launchforge-config-edge
  labels:
    {{- include "launchforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-edge
spec:
  selector:
    app.kubernetes.io/name: {{ include "launchforge.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: config-edge
  ports:
    - {name: http, port: 8082, targetPort: http}
