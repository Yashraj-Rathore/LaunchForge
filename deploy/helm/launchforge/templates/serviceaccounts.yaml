{{- $root := . -}}
{{- range $component := list "management" "config-edge" "event-worker" "web" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "launchforge.fullname" $root }}-{{ $component }}
  labels:
    {{- include "launchforge.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
