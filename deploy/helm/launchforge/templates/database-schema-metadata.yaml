apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "launchforge.fullname" . }}-database-schema
  labels:
    {{- include "launchforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-schema
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
data:
  database-schema-version: {{ .Values.release.databaseSchemaVersion | quote }}
  recorded-by-release: {{ .Values.release.version | quote }}
  recorded-by-git-sha: {{ .Values.release.revision | quote }}
