apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "launchforge.fullname" . }}-event-worker
  labels:
    {{- include "launchforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-worker
spec:
  replicas: {{ .Values.eventWorker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "launchforge.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: event-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "launchforge.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: event-worker
      annotations:
        checksum/runtime-config: {{ toJson (dict "database" .Values.external.database "kafka" .Values.external.kafka "redis" .Values.external.redis) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "launchforge.fullname" . }}-event-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "launchforge.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: event-worker
          image: {{ include "launchforge.image" .Values.images.eventWorker | quote }}
          imagePullPolicy: {{ .Values.images.eventWorker.pullPolicy }}
          securityContext:
            {{- include "launchforge.containerSecurityContext" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8083, protocol: TCP}
          env:
            {{- include "launchforge.databaseEnv" . | nindent 12 }}
            - {name: LAUNCHFORGE_REDIS_HOST, value: {{ .Values.external.redis.host | quote }}}
            - {name: LAUNCHFORGE_REDIS_PORT, value: {{ .Values.external.redis.port | quote }}}
            - {name: LAUNCHFORGE_KAFKA_BOOTSTRAP_SERVERS, value: {{ .Values.external.kafka.bootstrapServers | quote }}}
            - {name: LAUNCHFORGE_KAFKA_CONFIG_TOPIC, value: {{ .Values.external.kafka.configTopic | quote }}}
            - name: LAUNCHFORGE_ANALYTICS_ENABLED
              value: {{ .Values.external.analytics.enabled | quote }}
            - name: LAUNCHFORGE_KAFKA_ANALYTICS_TOPIC
              value: {{ .Values.external.analytics.kafkaTopic | quote }}
            - name: LAUNCHFORGE_KAFKA_ANALYTICS_CONSUMER_GROUP
              value: {{ .Values.external.analytics.kafkaConsumerGroup | quote }}
            - name: LAUNCHFORGE_CLICKHOUSE_URL
              value: {{ .Values.external.analytics.clickHouseUrl | quote }}
            - name: LAUNCHFORGE_CLICKHOUSE_USER
              value: {{ .Values.external.analytics.clickHouseUser | quote }}
            {{- if .Values.external.analytics.enabled }}
            - name: LAUNCHFORGE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.clickHousePasswordKey | quote }}
            {{- end }}
            {{- include "launchforge.commonJavaEnv" . | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.eventWorker.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "launchforge.fullname" . }}-event-worker
  labels:
    {{- include "launchforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: event-worker
spec:
  selector:
    app.kubernetes.io/name: {{ include "launchforge.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: event-worker
  ports:
    - {name: http, port: 8083, targetPort: http}
