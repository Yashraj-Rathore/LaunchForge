spring:
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: launchforge_test_session
        secure: false

launchforge:
  demo-seed:
    enabled: false
  security:
    abuse:
      redis-enabled: false
  sdk-keys:
    current-pepper-version: v1
    peppers:
      v1: integration-test-pepper-value-with-more-than-thirty-two-bytes
  audit:
    retention:
      deletion-enabled: true
      minimum-age: 365d
      preview-ttl: 15m
      maximum-batch-size: 1000

logging:
  level:
    root: WARN
