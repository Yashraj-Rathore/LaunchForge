spring:
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: launchforge_test_session
        secure: false

launchforge:
  demo-seed:
    enabled: false
  sdk-keys:
    current-pepper-version: v1
    peppers:
      v1: integration-test-pepper-value-with-more-than-thirty-two-bytes

logging:
  level:
    root: WARN
