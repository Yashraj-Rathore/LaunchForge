name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify immutable release source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      created_at: ${{ steps.source.outputs.created_at }}
    steps:
      - name: Check out release tag and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require annotated semantic-version tag on protected main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must use v-prefixed semantic versions.' >&2
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != 'tag' ]; then
            echo 'Release tags must be annotated; lightweight tags are rejected.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          successful_runs="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status completed --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "$successful_runs" -lt 1 ]; then
            echo 'The tagged commit does not have a successful completed CI run.' >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A GitHub release already exists for this immutable tag.' >&2
            exit 1
          fi
          created_at="$(date --utc --date="$(git show -s --format=%cI "$GITHUB_SHA")" '+%Y-%m-%dT%H:%M:%SZ')"
          echo "created_at=$created_at" >> "$GITHUB_OUTPUT"
      - name: Validate release repository contracts
        run: |
          python -m unittest discover -s eng/tests -p 'test_*.py'
          python eng/validate_supply_chain.py

  build-images:
    name: Build, scan, and attest ${{ matrix.name }}
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: management
            image: launchforge-management
            dockerfile: deploy/docker/Dockerfile.java
            build-args: |
              MODULE=backend/launchforge-control-api
              ARTIFACT=backend/launchforge-control-api/target/launchforge-control-api-0.1.0-SNAPSHOT-exec.jar
              APP_PORT=8080
          - name: config-edge
            image: launchforge-config-edge
            dockerfile: deploy/docker/Dockerfile.java
            build-args: |
              MODULE=backend/launchforge-config-edge
              ARTIFACT=backend/launchforge-config-edge/target/launchforge-config-edge-0.1.0-SNAPSHOT-exec.jar
              APP_PORT=8082
          - name: event-worker
            image: launchforge-event-worker
            dockerfile: deploy/docker/Dockerfile.java
            build-args: |
              MODULE=backend/launchforge-event-worker
              ARTIFACT=backend/launchforge-event-worker/target/launchforge-event-worker-0.1.0-SNAPSHOT-exec.jar
              APP_PORT=8083
          - name: web
            image: launchforge-web
            dockerfile: deploy/docker/Dockerfile.web
            build-args: ''
          - name: migrator
            image: launchforge-migrator
            dockerfile: deploy/docker/Dockerfile.migrator
            build-args: ''
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set immutable GHCR repository
        id: naming
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repository=ghcr.io/$owner/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR with the workflow token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish release image once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.naming.outputs.repository }}:${{ github.sha }}
            ${{ steps.naming.outputs.repository }}:${{ github.ref_name }}
          build-args: |
            OCI_CREATED=${{ needs.verify-source.outputs.created_at }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ github.ref_name }}
            ${{ matrix.build-args }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Gate fixable high and critical image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.naming.outputs.repository }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.naming.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach GitHub build provenance to the image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.naming.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attach GitHub SBOM attestation to the image digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.naming.outputs.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
      - name: Record immutable image metadata
        run: >-
          python eng/release_manifest.py record-image
          --name '${{ matrix.name }}'
          --repository '${{ steps.naming.outputs.repository }}'
          --digest '${{ steps.build.outputs.digest }}'
          --output 'image-metadata/${{ matrix.name }}.json'
      - name: Upload image metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-metadata-${{ matrix.name }}
          path: image-metadata/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  assemble-release:
    name: Assemble immutable release manifest
    needs: [verify-source, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download image metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-metadata-*
          path: release/image-metadata
          merge-multiple: true
      - name: Download image SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*.spdx.json
          path: release/sbom
          merge-multiple: true
      - name: Assemble and validate manifest
        run: |
          python eng/release_manifest.py assemble \
            --metadata-dir release/image-metadata \
            --compatibility deploy/release/compatibility.json \
            --release-tag "$GITHUB_REF_NAME" \
            --git-sha "$GITHUB_SHA" \
            --source-repository "$GITHUB_REPOSITORY" \
            --created-at '${{ needs.verify-source.outputs.created_at }}' \
            --output release/release-manifest.json
          python eng/release_manifest.py validate \
            --manifest release/release-manifest.json \
            --expected-tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA" \
            --expected-repository "$GITHUB_REPOSITORY"
      - name: Upload staged release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launchforge-release-${{ github.ref_name }}
          path: |
            release/release-manifest.json
            release/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 90

  staging:
    name: Deploy and smoke staging
    needs: assemble-release
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_NAME: ${{ vars.LAUNCHFORGE_HELM_RELEASE || 'launchforge' }}
      RELEASE_NAMESPACE: ${{ vars.LAUNCHFORGE_NAMESPACE || 'launchforge' }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launchforge-release-${{ github.ref_name }}
          path: release
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3
      - name: Configure staging cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.LAUNCHFORGE_KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          install -d -m 0700 "$RUNNER_TEMP/launchforge-kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/launchforge-kube/config"
          chmod 0600 "$RUNNER_TEMP/launchforge-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/launchforge-kube/config" >> "$GITHUB_ENV"
      - name: Materialize protected non-secret Helm values
        env:
          HELM_VALUES_B64: ${{ secrets.LAUNCHFORGE_HELM_VALUES_B64 }}
        run: |
          test -n "$HELM_VALUES_B64"
          printf '%s' "$HELM_VALUES_B64" | base64 --decode > "$RUNNER_TEMP/environment-values.yaml"
      - name: Validate promotion compatibility and render digest values
        run: |
          current_schema="$(kubectl --namespace "$RELEASE_NAMESPACE" get configmap \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=database-schema" \
            --output jsonpath='{.items[0].data.database-schema-version}' 2>/dev/null || true)"
          current_schema="${current_schema:-0}"
          python eng/release_manifest.py assert-compatible \
            --manifest release/release-manifest.json \
            --current-database-schema "$current_schema" \
            --mode promotion
          python eng/release_manifest.py render-values \
            --manifest release/release-manifest.json \
            --migrations-enabled true \
            --output "$RUNNER_TEMP/release-values.yaml"
      - name: Run forward migration and deploy staged digests
        run: |
          helm upgrade --install "$RELEASE_NAME" deploy/helm/launchforge \
            --namespace "$RELEASE_NAMESPACE" --create-namespace \
            --values "$RUNNER_TEMP/environment-values.yaml" \
            --values "$RUNNER_TEMP/release-values.yaml" \
            --wait --timeout 10m
          kubectl --namespace "$RELEASE_NAMESPACE" rollout status deployment \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME" --timeout=10m
          deployed_sha="$(kubectl --namespace "$RELEASE_NAMESPACE" get configmap \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=release-metadata" \
            --output jsonpath='{.items[0].data.git-sha}')"
          test "$deployed_sha" = "$GITHUB_SHA"
      - name: Set up Temurin Java for the staged Java demo
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25.0.4+7.0.LTS
          cache: maven
      - name: Set up Node.js for the staged browser smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Build staged smoke harnesses
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @launchforge/e2e exec playwright install --with-deps chromium
          bash ./mvnw --batch-mode --no-transfer-progress -pl demos/spring-demo -am package -DskipTests
      - name: Run staged OIDC, publish, Edge, SSE, and Java demo smoke
        env:
          LAUNCHFORGE_RELEASE_SMOKE: 'true'
          LAUNCHFORGE_RELEASE_SMOKE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          LAUNCHFORGE_E2E_BASE_URL: ${{ vars.LAUNCHFORGE_WEB_URL }}
          LAUNCHFORGE_E2E_USERNAME: ${{ vars.LAUNCHFORGE_SMOKE_USERNAME }}
          LAUNCHFORGE_E2E_PASSWORD: ${{ secrets.LAUNCHFORGE_SMOKE_PASSWORD }}
          LAUNCHFORGE_STAGING_EDGE_URL: ${{ vars.LAUNCHFORGE_EDGE_URL }}
          LAUNCHFORGE_STAGING_PROJECT_ID: ${{ vars.LAUNCHFORGE_SMOKE_PROJECT_ID }}
          LAUNCHFORGE_STAGING_ENVIRONMENT_ID: ${{ vars.LAUNCHFORGE_SMOKE_ENVIRONMENT_ID }}
          LAUNCHFORGE_SPRING_DEMO_JAR: demos/spring-demo/target/launchforge-spring-demo-0.1.0-SNAPSHOT-exec.jar
        run: pnpm --filter @launchforge/e2e test:e2e

  publish-release-record:
    name: Publish staged release record
    needs: staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launchforge-release-${{ github.ref_name }}
          path: release
      - name: Create or refresh GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/release-manifest.json release/sbom/*.spdx.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "LaunchForge $GITHUB_REF_NAME"
