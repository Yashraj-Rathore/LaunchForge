name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Dependency, secret, and repository security
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Review pull-request dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Set up Temurin Java for Maven dependency analysis
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25.0.4+7.0.LTS
          cache: maven
      - name: Populate the locked Maven dependency cache for Trivy
        run: bash ./mvnw --batch-mode --no-transfer-progress package -DskipTests
      - name: Scan proposed Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: '8.30.1'
      - name: Scan dependencies and infrastructure configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  evaluator-compatibility:
    name: Java and JavaScript evaluator compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25.0.4+7.0.LTS
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run both evaluators against the frozen corpus
        run: |
          bash ./mvnw --batch-mode --no-transfer-progress \
            -pl sdks/java/launchforge-java-sdk -am test -Dtest=GoldenVectorCorpusTest
          pnpm --filter @launchforge/js-core test

  backend:
    name: Java quality and integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # setup-java's Temurin catalog represents release build +7 as +7.0.LTS.
          java-version: 25.0.4+7.0.LTS
          cache: maven
      - name: Verify Java reactor
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
      - name: Verify PostgreSQL integration
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -pl tests/integration-tests -am verify -Pintegration

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @launchforge/admin-web exec playwright install --with-deps chromium
      - name: Run admin console journey
        run: pnpm --filter @launchforge/admin-web test:e2e
      - name: Run React SDK live-update demo
        run: pnpm --filter @launchforge/react-storefront-demo test:e2e

  identity-e2e:
    name: OIDC tenancy browser smoke
    runs-on: ubuntu-latest
    env:
      LAUNCHFORGE_POSTGRES_PASSWORD: ci-postgres-only
      LAUNCHFORGE_KEYCLOAK_ADMIN_USERNAME: local-admin
      LAUNCHFORGE_KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-admin-only
      LAUNCHFORGE_DEMO_USER_PASSWORD: ci-demo-user-only
      LAUNCHFORGE_CLICKHOUSE_PASSWORD: ci-clickhouse-only
      LAUNCHFORGE_GRAFANA_ADMIN_PASSWORD: ci-grafana-only
      LAUNCHFORGE_SDK_KEY_PEPPER: ci-sdk-key-pepper-at-least-32-bytes
      LAUNCHFORGE_REDIS_MANAGEMENT_PASSWORD: ci-management-redis-password-only
      LAUNCHFORGE_REDIS_CONFIG_EDGE_PASSWORD: ci-config-edge-redis-password-only
      LAUNCHFORGE_REDIS_EVENT_WORKER_PASSWORD: ci-event-worker-redis-password-only
      LAUNCHFORGE_MATERIALIZATION_SIGNING_KEY_ID: ci-v1
      LAUNCHFORGE_MATERIALIZATION_SIGNING_PRIVATE_KEY: ci-compose-validation-private-key-only
      LAUNCHFORGE_MATERIALIZATION_VERIFICATION_KEYS: ci-v1:ci-compose-validation-public-key-only
      LAUNCHFORGE_DB_URL: jdbc:postgresql://localhost:55432/launchforge
      LAUNCHFORGE_DB_USER: launchforge
      LAUNCHFORGE_DB_PASSWORD: ci-postgres-only
      LAUNCHFORGE_OIDC_ISSUER_URI: http://localhost:8081/realms/launchforge
      LAUNCHFORGE_OIDC_CLIENT_ID: launchforge-control
      LAUNCHFORGE_DEMO_SEED_ENABLED: 'true'
      LAUNCHFORGE_DEMO_SEED_LOCATION: file:deploy/local/tenancy-seed.sql
      LAUNCHFORGE_E2E_USERNAME: owner
      LAUNCHFORGE_E2E_PASSWORD: ci-demo-user-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # setup-java's Temurin catalog represents release build +7 as +7.0.LTS.
          java-version: 25.0.4+7.0.LTS
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false
      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @launchforge/e2e exec playwright install --with-deps chromium
      - name: Build Control API
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl backend/launchforge-control-api -am package
      - name: Start PostgreSQL and Keycloak
        run: docker compose --profile identity up -d --wait postgres keycloak
      - name: Start seeded Control API
        run: |
          nohup java -jar backend/launchforge-control-api/target/launchforge-control-api-0.1.0-SNAPSHOT-exec.jar \
            --spring.profiles.active=local >/tmp/launchforge-control.log 2>&1 &
          echo $! >/tmp/launchforge-control.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/launchforge-control.log
          exit 1
      - name: Run browser access smoke
        run: pnpm test:e2e
      - name: Stop identity test stack
        if: always()
        run: |
          if [ -f /tmp/launchforge-control.pid ]; then kill "$(cat /tmp/launchforge-control.pid)" || true; fi
          docker compose --profile identity down

  repository:
    name: Repository contracts
    runs-on: ubuntu-latest
    env:
      LAUNCHFORGE_POSTGRES_PASSWORD: ci-validation-only
      LAUNCHFORGE_KEYCLOAK_ADMIN_PASSWORD: ci-validation-only
      LAUNCHFORGE_DEMO_USER_PASSWORD: ci-validation-only
      LAUNCHFORGE_CLICKHOUSE_PASSWORD: ci-validation-only
      LAUNCHFORGE_GRAFANA_ADMIN_PASSWORD: ci-validation-only
      LAUNCHFORGE_SDK_KEY_PEPPER: ci-sdk-key-pepper-at-least-32-bytes
      LAUNCHFORGE_REDIS_MANAGEMENT_PASSWORD: ci-management-redis-password-only
      LAUNCHFORGE_REDIS_CONFIG_EDGE_PASSWORD: ci-config-edge-redis-password-only
      LAUNCHFORGE_REDIS_EVENT_WORKER_PASSWORD: ci-event-worker-redis-password-only
      LAUNCHFORGE_KAFKA_SASL_USERNAME: launchforge-platform
      LAUNCHFORGE_KAFKA_SASL_PASSWORD: ci-kafka-sasl-password-only
      LAUNCHFORGE_KAFKA_BROKER_PASSWORD: ci-kafka-broker-password-only
      LAUNCHFORGE_KAFKA_KEYSTORE_PASSWORD: ci-kafka-keystore-password-only
      LAUNCHFORGE_MATERIALIZATION_SIGNING_KEY_ID: ci-v1
      LAUNCHFORGE_MATERIALIZATION_SIGNING_PRIVATE_KEY: ci-compose-validation-private-key-only
      LAUNCHFORGE_MATERIALIZATION_VERIFICATION_KEYS: ci-v1:ci-compose-validation-public-key-only
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        run: |
          docker compose --profile identity --profile distribution --profile analytics \
            --profile observability --profile platform --profile demo config --quiet
          docker compose -f compose.yaml -f deploy/local/compose.transport-security.yaml \
            --profile identity --profile distribution --profile analytics \
            --profile observability --profile platform --profile demo config \
            | python eng/validate_transport_security.py compose-secure
      - name: Lint and render Helm chart
        run: |
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 \
            lint deploy/helm/launchforge --strict
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 \
            template launchforge deploy/helm/launchforge --namespace launchforge \
            | python eng/validate_transport_security.py helm-secure
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace \
            alpine/helm:4.2.4@sha256:76c375eed56144c68d6197c55bc5a4552fb42002190b796729901cbab3ae6e51 \
            template prompt12 deploy/helm/launchforge --namespace launchforge \
            --values deploy/local/kind/values.yaml \
            | python eng/validate_transport_security.py helm-local
      - name: Validate documentation
        run: python eng/validate_docs.py
      - name: Validate workflows and supply-chain contracts
        run: |
          docker run --rm --volume "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          python -m unittest discover -s eng/tests -p 'test_*.py'
          python eng/validate_supply_chain.py
      - name: Validate JSON templates and contracts
        run: |
          python -m json.tool templates/config-snapshot.example.json > /dev/null
          python -m json.tool templates/sdk-golden-vectors.json > /dev/null
          python -m json.tool templates/demo-seed.example.json > /dev/null
          python -m json.tool contracts/golden-vectors/json-variation-size-v1.json > /dev/null
          python -m json.tool contracts/events/config-revision-published-v1.schema.json > /dev/null
          python -m json.tool contracts/events/config-revision-published-v1.example.json > /dev/null
          python -m json.tool contracts/events/evaluation-event-batch-v1.schema.json > /dev/null
          python -m json.tool contracts/events/evaluation-event-batch-v1.example.json > /dev/null
          python -m json.tool deploy/helm/launchforge/values.schema.json > /dev/null
          python -m json.tool deploy/release/compatibility.json > /dev/null
          python -m json.tool security/supply-chain-exceptions.json > /dev/null
