name: Promote production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release workflow run ID whose staging smoke passed
        required: true
        type: string
      release_tag:
        description: Annotated semantic-version release tag from that run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: launchforge-production
  cancel-in-progress: false

jobs:
  promote:
    name: Promote staging-tested digests
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      RELEASE_NAME: ${{ vars.LAUNCHFORGE_HELM_RELEASE || 'launchforge' }}
      RELEASE_NAMESPACE: ${{ vars.LAUNCHFORGE_NAMESPACE || 'launchforge' }}
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Download the staging-tested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: launchforge-release-${{ inputs.release_tag }}
          path: release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source run, tag, repository, and commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r '.name' <<<"$run_json")" = 'Release'
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.event' <<<"$run_json")" = 'push'
          test "$(jq -r '.head_branch' <<<"$run_json")" = "$RELEASE_TAG"
          test "$(jq -r '.head_repository.full_name' <<<"$run_json")" = "$GITHUB_REPOSITORY"
          source_sha="$(jq -r '.head_sha' <<<"$run_json")"
          python eng/release_manifest.py validate \
            --manifest release/release-manifest.json \
            --expected-tag "$RELEASE_TAG" \
            --expected-sha "$source_sha" \
            --expected-repository "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.3
      - name: Configure production cluster access
        env:
          KUBE_CONFIG_B64: ${{ secrets.LAUNCHFORGE_KUBE_CONFIG_B64 }}
        run: |
          test -n "$KUBE_CONFIG_B64"
          install -d -m 0700 "$RUNNER_TEMP/launchforge-kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/launchforge-kube/config"
          chmod 0600 "$RUNNER_TEMP/launchforge-kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/launchforge-kube/config" >> "$GITHUB_ENV"
      - name: Materialize protected non-secret Helm values
        env:
          HELM_VALUES_B64: ${{ secrets.LAUNCHFORGE_HELM_VALUES_B64 }}
        run: |
          test -n "$HELM_VALUES_B64"
          printf '%s' "$HELM_VALUES_B64" | base64 --decode > "$RUNNER_TEMP/environment-values.yaml"
      - name: Validate migration compatibility and render the same digests
        run: |
          current_schema="$(kubectl --namespace "$RELEASE_NAMESPACE" get configmap \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=database-schema" \
            --output jsonpath='{.items[0].data.database-schema-version}' 2>/dev/null || true)"
          current_schema="${current_schema:-0}"
          python eng/release_manifest.py assert-compatible \
            --manifest release/release-manifest.json \
            --current-database-schema "$current_schema" \
            --mode promotion
          python eng/release_manifest.py render-values \
            --manifest release/release-manifest.json \
            --migrations-enabled true \
            --output "$RUNNER_TEMP/release-values.yaml"
      - name: Run forward migration and promote production
        run: |
          helm upgrade --install "$RELEASE_NAME" deploy/helm/launchforge \
            --namespace "$RELEASE_NAMESPACE" --create-namespace \
            --values "$RUNNER_TEMP/environment-values.yaml" \
            --values "$RUNNER_TEMP/release-values.yaml" \
            --wait --timeout 10m
          kubectl --namespace "$RELEASE_NAMESPACE" rollout status deployment \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME" --timeout=10m
          deployed_sha="$(kubectl --namespace "$RELEASE_NAMESPACE" get configmap \
            --selector "app.kubernetes.io/instance=$RELEASE_NAME,app.kubernetes.io/component=release-metadata" \
            --output jsonpath='{.items[0].data.git-sha}')"
          test "$deployed_sha" = "$SOURCE_SHA"
